services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rs_auth_ai
      POSTGRES_PASSWORD: rs_auth_ai
      POSTGRES_DB: rs_auth_ai
    ports:
      - "5432:5432"
    volumes:
      - rs_auth_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rs_auth_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rs_auth_ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rs_auth_ai_postgres_data:
  rs_auth_ai_redis_data:
